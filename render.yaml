# Render blueprint for the checkout-api demo service (free tier).
# DD_API_KEY is a secret: set it in the Render dashboard (sync: false below
# means the blueprint leaves it untouched).
services:
  - type: web
    name: checkout-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DD_SERVICE
        value: checkout-api
      - key: DD_ENV
        value: demo
      - key: DD_SITE
        value: datadoghq.com
      # Traces are exported via OTLP straight to Datadog's intake (free tier,
      # no agent). The dd-api-key header is assembled in src/server.js from
      # the DD_API_KEY secret, so it never appears here.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otlp.datadoghq.com
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: DD_API_KEY
        sync: false
